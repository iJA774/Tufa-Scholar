name: Sync benchmark from main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: benchmark-main-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Merge main into benchmark
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main benchmark
          git switch --force-create benchmark origin/benchmark
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'Benchmark is already up to date.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git merge --no-edit origin/main; then
            {
              echo '### Benchmark sync failed'
              echo 'The remote benchmark branch has not been modified.'
              echo
              echo 'Conflicting files (if any):'
              echo '~~~'
              git diff --name-only --diff-filter=U
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/benchmark-conflicts.txt"
            git merge --abort || true
            exit 1
          fi

          # A normal, non-force push also protects concurrent benchmark development.
          git push origin HEAD:refs/heads/benchmark
          echo 'Merged main into benchmark.' >> "$GITHUB_STEP_SUMMARY"

      - name: Notify maintainers on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title='Benchmark sync failed: main -> benchmark'
          body="$RUNNER_TEMP/benchmark-sync-issue.md"
          {
            echo '@iJA774 自动同步失败。请检查日志并手动将 main 同步至 benchmark；不要反向合并。'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Trigger: $GITHUB_SHA"
            if [ -s "$RUNNER_TEMP/benchmark-conflicts.txt" ]; then
              echo
              echo 'Conflicting files:'
              echo '~~~'
              cat "$RUNNER_TEMP/benchmark-conflicts.txt"
              echo '~~~'
            fi
          } > "$body"
          existing=$(gh issue list --state open --search '"Benchmark sync failed" in:title' --limit 100 --json number,title --jq '.[] | select(.title == "Benchmark sync failed: main -> benchmark") | .number' | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body"
          fi
